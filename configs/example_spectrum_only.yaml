# CLS Spectrum Viewer - Cobalt (spectrum-only mode)
#
# No 'statistics' section -> spectrum-only mode:
#   - No timing calculations performed
#   - No yield, efficiency, background, or peaks_to_measure needed
#   - Generates spectrum plots and HFS peak tables only
#
# Same element, transition, laser and isotopes as example_cobalt.yaml,
# reduced to what a spectrum needs.
#
# Isotopes: 59Co (reference), 54Co (I=0 g.s. with I=7 isomer)
# Transition: 3350.494 -> 47078.494 cm-1

element: Co
Z: 27

transition:
  lower_level_cm: 3350.494
  upper_level_cm: 47078.494
  J_lower: 5
  J_upper: 6

laser:
  setpoint_cm: 10920.071952    # fundamental laser wavenumber
  harmonic: 4                  # multiplier (effective = setpoint * harmonic)

beam:
  voltage_kV: 29.9
  charge_state: 1
  geometry: anti-collinear

linewidth:
  fwhm_MHz: 100

reference:
  A: 59
  I: 3.5
  mu: 4.627
  Q: 0.42
  A_lower_MHz: 1056.8
  B_lower_MHz: 0.0
  A_upper_MHz: 333.52
  B_upper_MHz: 0.0

scan:
  voltage_range_V: 100
  # step_size_V and dwell_time_ms not needed in spectrum-only mode

# No 'statistics' section -- this triggers spectrum-only mode

isotopes:
  # ===== 59Co: reference isotope, I=7/2 =====
  - A: 59
    label: "59Co"
    I: 3.5
    mu: 4.627
    Q: 0.42
    isotope_shift_MHz: 0.0

  # ===== 54Co: I=0 (g.s.) with I=7 isomer =====
  # The I=0 ground state has no hyperfine structure (a single line);
  # the isomer carries its own A constants.
  - A: 54
    label: "54Co"
    I: 0
    mu: 0.0
    Q: 0.0
    isotope_shift_MHz: -2135
    isomer:
      I: 7
      mu: 3.89
      Q: 0.0
      isotope_shift_MHz: -2100
      plot_with_gs: true
      A_lower_MHz: 370.0
      A_upper_MHz: 117.0
